specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: eas-base-sepolia
    network: base-sepolia
    source:
      address: "0x4200000000000000000000000000000000000021"
      abi: eas-base-sepolia
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AdminChanged
        - Upgraded
      abis:
        - name: eas-base-sepolia
          file: ./abis/eas-base-sepolia.json
      eventHandlers:
        - event: AdminChanged(address,address)
          handler: handleAdminChanged
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/eas-base-sepolia.ts
